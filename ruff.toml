# ruff.toml - USN library lint configuration
target-version = "py310"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "F401",   # Unused imports (many re-exports in __init__.py)
    "N803",   # Argument name should be lowercase (math notation: A, B, R, etc.)
    "N806",   # Variable in function should be lowercase (math notation: R_t, S_t, etc.)
    "N812",   # Lowercase imported as non-lowercase (common aliasing patterns)
    "N817",   # CamelCase imported as acronym (e.g., FSDP)
    "E741",   # Ambiguous variable name (l used for layers in math context)
]

[lint.isort]
known-first-party = ["usn"]
